<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Kehadiran Murid Digital V2.0</title>

    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #eff6ff;
            --text: #334155;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59,130,246,.15), transparent 35%),
                linear-gradient(135deg, #eff6ff 0%, #f8fafc 55%, #e0f2fe 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        .container {
            width: 90%;
            max-width: 460px;
            background: rgba(255,255,255,.96);
            padding: 34px 28px 30px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(15,23,42,.14);
            text-align: center;
            border: 1px solid rgba(255,255,255,.8);
        }

        .logo {
            width: 82px;
            height: 82px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.35rem;
            color: var(--primary);
            margin: 0;
            font-weight: 800;
            letter-spacing: -.4px;
        }

        .subtitle {
            font-size: .72rem;
            color: #64748b;
            margin: 6px 0 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-box {
            padding: 13px 14px;
            border-radius: 14px;
            font-size: .88rem;
            font-weight: 700;
            margin-bottom: 18px;
            border: 1px solid #dbeafe;
            background: #eff6ff;
            color: #475569;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 20px;
            background: #020617;
            display: none;
            transform: scaleX(-1);
            box-shadow: 0 12px 30px rgba(15,23,42,.18);
        }

        .camera-wrap {
            position: relative;
            width: 100%;
            display: none;
        }

        .camera-wrap video { display: block; }

        .scan-frame {
            position: absolute;
            inset: 12%;
            border: 2px solid rgba(255,255,255,.7);
            border-radius: 28px;
            pointer-events: none;
            box-shadow: 0 0 0 999px rgba(2,6,23,.08);
        }

        .scan-line {
            position: absolute;
            left: 16%;
            right: 16%;
            top: 22%;
            height: 2px;
            background: #22c55e;
            box-shadow: 0 0 15px rgba(34,197,94,.95);
            animation: scan 2.1s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0%,100% { top: 22%; opacity: .5; }
            50% { top: 78%; opacity: 1; }
        }

        .camera-info {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: .7rem;
            color: #64748b;
        }

        .camera-info span {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.05rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-main:active { transform: scale(.99); }

        .small-btn {
            border: 0;
            background: #e2e8f0;
            color: #334155;
            padding: 10px 13px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .controls {
            display: none;
            gap: 8px;
            margin-top: 12px;
        }

        .controls button {
            flex: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .overlay-card {
            width: min(90%, 430px);
            padding: 34px 24px;
            border-radius: 28px;
            background: rgba(15,23,42,.94);
            box-shadow: 0 30px 80px rgba(0,0,0,.3);
        }

        .overlay-icon {
            font-size: 4.8rem;
            margin-bottom: 12px;
        }

        .overlay-title {
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .overlay-detail {
            margin-top: 14px;
            font-size: .95rem;
            line-height: 1.7;
            color: #e2e8f0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: .7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: .7; }
        }

        #sleepOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #sleepOverlay img {
            width: 120px;
            animation: pulse 3s infinite ease-in-out;
            margin-bottom: 20px;
        }

        #sleepOverlay p {
            color: #94a3b8;
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }

        .student-badge {
            display: none;
            margin: 12px 0 0;
            padding: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: .78rem;
        }

        .student-badge strong {
            display: block;
            color: #0f172a;
            font-size: .9rem;
        }
    </style>
</head>

<body>

<div id="sleepOverlay" onclick="wakeUp()">
    <img src="ssa.png" alt="Logo E-Hadir">
    <p>Sentuh Skrin Untuk Mula</p>
</div>

<div id="overlay" class="overlay">
    <div class="overlay-card">
        <div id="overlayIcon" class="overlay-icon">✅</div>
        <div id="overlayText" class="overlay-title"></div>
        <div id="overlayDetail" class="overlay-detail"></div>
    </div>
</div>

<div id="confirmModal" class="overlay" style="background:rgba(15,23,42,.96);z-index:101;">
    <div class="overlay-card">
        <div style="font-size:3rem;">👤</div>
        <h2 style="color:white;margin:8px 0 4px;">PENGESAHAN MURID</h2>
        <p style="color:#cbd5e1;margin:0 0 18px;">Adakah ini anda?</p>

        <div id="confirmName" style="font-size:1.65rem;font-weight:800;color:#4ade80;margin-bottom:5px;text-align:center;">
            NAMA MURID
        </div>

        <div id="confirmClass" style="font-size:1.05rem;font-weight:700;color:#bfdbfe;margin-bottom:28px;">
            KELAS
        </div>

        <div style="display:flex;gap:12px;width:100%;">
            <button onclick="confirmMatch(true)" style="flex:1;padding:15px;background:#16a34a;color:white;border:none;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;">
                YA, BETUL
            </button>
            <button onclick="confirmMatch(false)" style="flex:1;padding:15px;background:#ef4444;color:white;border:none;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;">
                BUKAN SAYA
            </button>
        </div>
    </div>
</div>

<div id="accessCodeModal" class="overlay" style="background:rgba(15,23,42,.98);z-index:102;">
    <div class="overlay-card">
        <div style="font-size:3rem;">🔐</div>
        <h2 style="color:white;margin:8px 0 5px;">KOD AKSES INDIVIDU</h2>
        <p style="color:#cbd5e1;margin:0 auto 20px;line-height:1.5;">
            Pengecaman wajah gagal 2 kali. Sila gunakan Kod Akses Individu.
        </p>

        <input type="password"
               id="personalCodeInput"
               placeholder="Masukkan Kod Anda"
               autocomplete="off"
               style="width:100%;margin-bottom:12px;">

        <div style="display:flex;gap:12px;">
            <button onclick="submitAccessCode()" style="flex:2;padding:14px;background:#2563eb;color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer;">
                SAHKAN HADIR
            </button>
            <button onclick="cancelAccessCode()" style="flex:1;padding:14px;background:#64748b;color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer;">
                BATAL
            </button>
        </div>
    </div>
</div>

<div class="container">
    <img src="ssa.png" alt="Logo E-Hadir" class="logo">

    <h1>E-HADIR DIGITAL</h1>
    <div class="subtitle">SISTEM KEHADIRAN MURID • V2.0</div>

    <div id="status" class="status-box">Memulakan sistem AI...</div>

    <div id="pinSection">
        <input type="password"
               id="pinInput"
               placeholder="KOD PIN 6-DIGIT"
               maxlength="6"
               inputmode="numeric"
               autocomplete="off">
        <button class="btn-main" onclick="verifyPin()">AKTIFKAN IMBASAN</button>
    </div>

    <div id="cameraWrap" class="camera-wrap">
        <video id="video" autoplay muted playsinline></video>
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
    </div>

    <div id="studentBadge" class="student-badge">
        <strong id="studentBadgeName">-</strong>
        <span id="studentBadgeClass">-</span>
    </div>

    <div id="cameraControls" class="controls">
        <button class="small-btn" onclick="switchCamera()">🔄 Tukar Kamera</button>
        <button class="small-btn" onclick="reloadStudents()">♻️ Segar Data</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        query,
        where,
        Timestamp,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD834R5Au1ksM0h-G0imluipJIN1br2g2g",
        authDomain: "panitia-5be3a.firebaseapp.com",
        projectId: "panitia-5be3a",
        storageBucket: "panitia-5be3a.firebasestorage.app",
        messagingSenderId: "814796521590",
        appId: "1:814796521590:web:c0e31fa985401bcc571f57"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DAILY_PIN = "123456";
    const MODEL_URL = "https://raw.githubusercontent.com/vladmandic/face-api/master/model/";
    // Waktu sesi kehadiran
    // Pagi  = sebelum 2:00 petang
    // KAFA  = 2:00 petang dan selepasnya
    // Lewat KAFA = selepas 2:05 petang
    const MORNING_SESSION_END = "13:00";
    const KAFA_LATE_TIME = "14:05";
    const MATCH_THRESHOLD = 0.48;

    // Kawalan imbasan supaya kamera tidak terlalu sensitif.
    const SCAN_INTERVAL = 260;
    const STABLE_MATCH_REQUIRED = 2;
    const REJECT_COOLDOWN = 3500;
    const SLEEP_TIMEOUT = 10000;

    // Anggaran saiz wajah dalam paparan kamera.
    // Jika terlalu kecil = murid terlalu jauh.
    // Jika terlalu besar = murid terlalu dekat.
    const FACE_MIN_WIDTH_RATIO = 0.20;
    const FACE_MAX_WIDTH_RATIO = 0.52;
    const FACE_CENTER_MIN = 0.30;
    const FACE_CENTER_MAX = 0.70;

    // =====================================================
    // SAGE / SSA DATA ARCHITECTURE
    // students            = Master Data Murid + Kod Akses
    // student_biometrics  = descriptor biometrik sahaja
    // attendance          = transaksi kehadiran berdasarkan studentId + session
    // =====================================================

    let registeredUsers = [];
    let isProcessing = false;
    let isSleeping = false;
    let lastScanTime = 0;
    let wrongMatchCount = 0;
    let pendingStudent = null;
    let currentStream = null;
    let currentFacingMode = "user";
    let sleepTimer = null;
    let scanBlockedUntil = 0;
    let candidateStudentId = null;
    let candidateMatchCount = 0;

    // =====================================================
    // FIRESTORE EFFICIENT MODE
    // Attendance hari ini dibaca SEKALI selepas PIN.
    // Selepas itu semakan duplicate dibuat daripada RAM cache.
    // Ini mengelakkan query Firestore pada setiap imbasan wajah.
    // =====================================================
    const todayAttendanceCache = new Map();
    let todayAttendanceLoaded = false;
    let todayAttendanceLoading = false;
    let todayAttendanceDateKey = null;

    const successBeep = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");
    successBeep.preload = "auto";

    function $(id) {
        return document.getElementById(id);
    }

    function setStatus(text, color = "#475569", background = "#eff6ff") {
        $("status").innerText = text;
        $("status").style.color = color;
        $("status").style.background = background;
    }

    function normalizeDescriptor(item) {
        if (Array.isArray(item)) {
            return new Float32Array(item);
        }

        if (item && Array.isArray(item.d)) {
            return new Float32Array(item.d);
        }

        return null;
    }

    function normalizeStudent(studentId, studentData, biometricData) {
        const rawDescriptors = Array.isArray(biometricData?.descriptors)
            ? biometricData.descriptors
            : [];

        const descriptors = rawDescriptors
            .map(normalizeDescriptor)
            .filter(Boolean);

        return {
            // ID Murid ialah identiti utama SAGE/SSA.
            studentId: String(studentId || "").trim(),
            name: String(studentData?.name || "").trim(),
            kelas: String(studentData?.kelas || "").trim(),
            // Kod Akses ialah sebahagian daripada Master Collection students.
            // Jangan ambil daripada student_biometrics.
            accessCode: String(studentData?.accessCode ?? "").trim(),
            descriptors
        };
    }

    async function loadStudents() {
        setStatus("Memuatkan Master Data murid...", "#1d4ed8", "#eff6ff");

        // 1. Baca Master Collection
        const studentSnap = await getDocs(collection(db, "students"));
        const studentMap = new Map();

        studentSnap.forEach(docSnap => {
            const data = docSnap.data();
            const studentId = String(data.studentId || "").trim();

            if (studentId) {
                studentMap.set(studentId, data);
            }
        });

        // 2. Baca data khusus biometrik SSA
        const biometricSnap = await getDocs(collection(db, "student_biometrics"));

        registeredUsers = [];

        biometricSnap.forEach(docSnap => {
            const biometricData = docSnap.data();
            const studentId = String(
                biometricData.studentId || docSnap.id || ""
            ).trim();

            const masterData = studentMap.get(studentId);

            // Biometrik tanpa Master Data tidak digunakan.
            if (!masterData) {
                console.warn("Biometrik diabaikan kerana studentId tiada dalam students:", studentId);
                return;
            }

            const student = normalizeStudent(
                studentId,
                masterData,
                biometricData
            );

            if (student.name && student.descriptors.length > 0) {
                registeredUsers.push(student);
            }
        });

        console.log("Master Data murid:", studentMap.size);
        console.log("Murid dengan biometrik:", registeredUsers.length);

        if (registeredUsers.length > 0) {
            setStatus(
                `${registeredUsers.length} murid berdaftar biometrik sedia diimbas`,
                "#166534",
                "#f0fdf4"
            );
        } else {
            setStatus(
                `Master Data: ${studentMap.size} murid. Belum ada biometrik berdaftar.`,
                "#92400e",
                "#fffbeb"
            );
        }
    }

    async function initSystem() {
        try {
            setStatus("Memuatkan model AI...", "#475569", "#f1f5f9");

            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = 224;
            tempCanvas.height = 224;

            await faceapi.detectSingleFace(
                tempCanvas,
                new faceapi.TinyFaceDetectorOptions()
            );

            setStatus("Sistem sedia. Masukkan PIN.", "#1d4ed8", "#eff6ff");
            $("pinSection").style.display = "block";
        } catch (error) {
            console.error("AI initialization error:", error);
            setStatus("Gagal memuatkan AI. Periksa sambungan internet.", "#b91c1c", "#fef2f2");
        }
    }

    window.verifyPin = async function() {
        const pin = $("pinInput").value.trim();

        if (pin !== DAILY_PIN) {
            alert("PIN Salah!");
            $("pinInput").select();
            return;
        }

        $("pinSection").style.display = "none";
        setStatus("Memuatkan data SSA...", "#1d4ed8", "#eff6ff");

        try {
            await loadStudents();

            // Efficient Mode: baca attendance hari ini SEKALI sahaja.
            await loadTodayAttendanceCache();

            if (registeredUsers.length === 0) {
                setStatus(
                    "Belum ada murid berdaftar biometrik. Sila daftar biometrik di Admin.",
                    "#92400e",
                    "#fffbeb"
                );
                $("pinSection").style.display = "block";
                return;
            }

            await startCamera();
            resetTimer();
        } catch (error) {
            console.error("Database error:", error);
            setStatus("Ralat memuatkan data Firebase.", "#b91c1c", "#fef2f2");
            alert("Ralat memuatkan data: " + error.message);
            $("pinSection").style.display = "block";
        }
    };

    async function startCamera() {
        stopCamera();

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: { ideal: currentFacingMode }
            },
            audio: false
        });

        currentStream = stream;

        const video = $("video");
        video.srcObject = stream;

        $("cameraWrap").style.display = "block";
        $("cameraControls").style.display = "flex";

        await video.play();

        setStatus("Kamera bersedia. Berdiri di tengah dan lihat kamera...", "#166534", "#f0fdf4");
        scanBlockedUntil = 0;
        candidateStudentId = null;
        candidateMatchCount = 0;
        requestAnimationFrame(scanLoop);
    }

    function stopCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
    }

    window.switchCamera = async function() {
        if (isProcessing) return;

        currentFacingMode =
            currentFacingMode === "user" ? "environment" : "user";

        try {
            setStatus("Menukar kamera...", "#1d4ed8", "#eff6ff");
            await startCamera();
        } catch (error) {
            console.error(error);
            currentFacingMode =
                currentFacingMode === "user" ? "environment" : "user";

            alert("Kamera kedua tidak tersedia.");
            await startCamera();
        }
    };

    window.reloadStudents = async function() {
        if (isProcessing) return;

        try {
            setStatus("Mengemas kini data SSA...", "#1d4ed8", "#eff6ff");
            await loadStudents();
            await loadTodayAttendanceCache(true);
            setStatus(
                `${registeredUsers.length} murid dengan biometrik sedia diimbas.`,
                "#166534",
                "#f0fdf4"
            );
        } catch (error) {
            console.error(error);
            setStatus("Gagal mengemas kini data.", "#b91c1c", "#fef2f2");
        }
    };

    async function scanLoop(now) {
        requestAnimationFrame(scanLoop);

        if (isProcessing || isSleeping) return;

        // Selepas BUKAN SAYA, beri masa kepada murid untuk berundur/bersedia.
        if (Date.now() < scanBlockedUntil) return;

        if (!lastScanTime || now - lastScanTime >= SCAN_INTERVAL) {
            lastScanTime = now;
            await doScan();
        }
    }

    async function doScan() {
        const video = $("video");

        if (!video || video.videoWidth === 0 || video.videoHeight === 0) {
            return;
        }

        try {
            const detection = await faceapi
                .detectSingleFace(
                    video,
                    new faceapi.TinyFaceDetectorOptions({
                        inputSize: 224,
                        scoreThreshold: 0.4
                    })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (!detection) {
                setStatus("Mencari wajah...", "#475569", "#eff6ff");
                $("studentBadge").style.display = "none";
                return;
            }

            resetTimer();

            // -------------------------------------------------
            // SEMAK JARAK & KEDUDUKAN WAJAH
            // -------------------------------------------------
            const box = detection.detection.box;
            const videoWidth = video.videoWidth || 1;
            const videoHeight = video.videoHeight || 1;
            const faceWidthRatio = box.width / videoWidth;
            const faceHeightRatio = box.height / videoHeight;
            const faceCenterX = (box.x + box.width / 2) / videoWidth;
            const faceCenterY = (box.y + box.height / 2) / videoHeight;

            // Wajah terlalu jauh.
            if (faceWidthRatio < FACE_MIN_WIDTH_RATIO) {
                candidateStudentId = null;
                candidateMatchCount = 0;
                setStatus("SILA DEKAT SEDIKIT DENGAN KAMERA", "#92400e", "#fffbeb");
                return;
            }

            // Wajah terlalu dekat.
            if (faceWidthRatio > FACE_MAX_WIDTH_RATIO) {
                candidateStudentId = null;
                candidateMatchCount = 0;
                setStatus("SILA UNDUR SEDIKIT DARI KAMERA", "#92400e", "#fffbeb");
                return;
            }

            // Wajah terlalu tinggi / rendah.
            if (faceCenterY < 0.30) {
                candidateStudentId = null;
                candidateMatchCount = 0;
                setStatus("SILA TURUNKAN KEDUDUKAN WAJAH", "#92400e", "#fffbeb");
                return;
            }

            if (faceCenterY > 0.72) {
                candidateStudentId = null;
                candidateMatchCount = 0;
                setStatus("SILA NAIKKAN KEDUDUKAN WAJAH", "#92400e", "#fffbeb");
                return;
            }

            // Wajah terlalu ke kiri / kanan.
            if (faceCenterX < FACE_CENTER_MIN) {
                candidateStudentId = null;
                candidateMatchCount = 0;
                setStatus("SILA GERAK SEDIKIT KE KANAN", "#92400e", "#fffbeb");
                return;
            }

            if (faceCenterX > FACE_CENTER_MAX) {
                candidateStudentId = null;
                candidateMatchCount = 0;
                setStatus("SILA GERAK SEDIKIT KE KIRI", "#92400e", "#fffbeb");
                return;
            }

            setStatus("Wajah berada pada posisi sesuai. Mengesahkan...", "#1d4ed8", "#eff6ff");

            let bestMatch = null;
            let lowestDist = Infinity;

            for (const student of registeredUsers) {
                for (const savedDescriptor of student.descriptors) {
                    const distance = faceapi.euclideanDistance(
                        detection.descriptor,
                        savedDescriptor
                    );

                    if (distance < lowestDist) {
                        lowestDist = distance;
                        bestMatch = student;
                    }
                }
            }

            if (bestMatch && lowestDist < MATCH_THRESHOLD) {
                // Jangan terus buka modal pada satu frame sahaja.
                // Wajah yang sama mesti dikesan secara konsisten sekurang-kurangnya
                // STABLE_MATCH_REQUIRED kali untuk mengurangkan false match.
                if (candidateStudentId === bestMatch.studentId) {
                    candidateMatchCount++;
                } else {
                    candidateStudentId = bestMatch.studentId;
                    candidateMatchCount = 1;
                }

                if (candidateMatchCount < STABLE_MATCH_REQUIRED) {
                    setStatus("Sila pandang kamera dan jangan bergerak...", "#1d4ed8", "#eff6ff");
                    return;
                }

                isProcessing = true;
                pendingStudent = bestMatch;
                candidateStudentId = null;
                candidateMatchCount = 0;

                // Jangan reset wrongMatchCount di sini.
                // Dua kali "BUKAN SAYA" akan membuka fallback Kod Akses.

                $("confirmName").innerText = bestMatch.name.toUpperCase();
                $("confirmClass").innerText = bestMatch.kelas
                    ? bestMatch.kelas.toUpperCase()
                    : "KELAS TIDAK DINYATAKAN";

                $("confirmModal").style.display = "flex";

                try {
                    await successBeep.play();
                } catch (_) {}

                return;
            }

            candidateStudentId = null;
            candidateMatchCount = 0;

            setStatus(
                `Wajah belum dikenali. Skor: ${isFinite(lowestDist) ? lowestDist.toFixed(2) : "-"}`,
                "#b91c1c",
                "#fef2f2"
            );

        } catch (error) {
            console.error("Ralat AI:", error);
            setStatus("Sistem AI mengalami ralat. Cuba lagi.", "#b91c1c", "#fef2f2");
        }
    }

    function getTodayKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function timeToMinutes(time) {
        const [hour, minute] = time.split(":").map(Number);
        return hour * 60 + minute;
    }

    function getSession(date = new Date()) {
        const currentMinutes = date.getHours() * 60 + date.getMinutes();
        const morningEnd = timeToMinutes(MORNING_SESSION_END);

        // 1:00 PM masih sesi pagi. Selepas 1:00 PM terus dianggap KAFA.
        return currentMinutes <= morningEnd ? "PAGI" : "KAFA";
    }

    function getSessionLabel(session) {
        return session === "KAFA" ? "KAFA" : "SESI PAGI";
    }

    function getAttendanceStatus(date = new Date()) {
        const session = getSession(date);

        // Untuk sesi pagi, status kekal seperti rekod biasa.
        if (session === "PAGI") {
            return "Hadir";
        }

        // KAFA: 2:05 petang ialah had lewat yang dipersetujui.
        // Pada 2:05 tepat dikira Lewat.
        const currentMinutes = date.getHours() * 60 + date.getMinutes();
        const lateMinutes = timeToMinutes(KAFA_LATE_TIME);

        return currentMinutes >= lateMinutes
            ? "Hadir (Lewat)"
            : "Hadir";
    }

    function getRecordSession(record) {
        // Rekod baharu mempunyai medan session.
        if (record?.session === "PAGI" || record?.session === "KAFA") {
            return record.session;
        }

        // Rekod lama mungkin tiada session. Tentukan berdasarkan timestamp.
        // Ini penting supaya rekod pagi lama tidak menghalang kehadiran KAFA.
        if (record?.timestamp instanceof Date) {
            return getSession(record.timestamp);
        }

        return null;
    }

    function attendanceCacheKey(studentId, session) {
        return `${getTodayKey()}|${String(studentId).trim()}|${session}`;
    }

    async function loadTodayAttendanceCache(force = false) {
        const today = getTodayKey();

        if (todayAttendanceLoaded && todayAttendanceDateKey === today && !force) {
            return;
        }

        if (todayAttendanceLoading) {
            return;
        }

        todayAttendanceLoading = true;
        todayAttendanceCache.clear();
        todayAttendanceDateKey = today;

        try {
            const now = new Date();
            const start = new Date(now);
            start.setHours(0, 0, 0, 0);

            const end = new Date(now);
            end.setHours(23, 59, 59, 999);

            // SATU bacaan untuk semua rekod attendance hari ini.
            // Tiada query per murid semasa scanning.
            const todayQuery = query(
                collection(db, "attendance"),
                where("timestamp", ">=", Timestamp.fromDate(start)),
                where("timestamp", "<=", Timestamp.fromDate(end))
            );

            const snapshot = await getDocs(todayQuery);

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const studentId = String(data.studentId || data.userId || "").trim();

                if (!studentId) return;

                const timestamp = data.timestamp?.toDate
                    ? data.timestamp.toDate()
                    : null;

                if (!timestamp || getTodayKey(timestamp) !== today) return;

                const recordSession = getRecordSession({ ...data, timestamp });
                if (recordSession !== "PAGI" && recordSession !== "KAFA") return;

                const key = attendanceCacheKey(studentId, recordSession);

                // Simpan rekod pertama yang ditemui untuk sesi tersebut.
                // Cache ini hanya digunakan untuk semakan duplicate.
                if (!todayAttendanceCache.has(key)) {
                    todayAttendanceCache.set(key, {
                        ...data,
                        studentId,
                        timestamp
                    });
                }
            });

            todayAttendanceLoaded = true;
            console.log(
                `[SSA Efficient Mode] ${snapshot.size} rekod attendance hari ini dimuatkan sekali. ` +
                `Cache duplicate: ${todayAttendanceCache.size}`
            );
        } catch (error) {
            todayAttendanceLoaded = false;
            console.error("Gagal memuatkan cache attendance hari ini:", error);
            throw error;
        } finally {
            todayAttendanceLoading = false;
        }
    }

    async function findTodayAttendance(studentId, targetSession = getSession()) {
        const key = attendanceCacheKey(studentId, targetSession);

        // Semakan duplicate TIDAK lagi membaca Firestore.
        return todayAttendanceCache.get(key) || null;
    }

    async function saveAttendance(student) {
        const now = new Date();
        const session = getSession(now);
        const sessionLabel = getSessionLabel(session);
        const status = getAttendanceStatus(now);

        try {
            setStatus(
                `Menyemak rekod ${sessionLabel}...`,
                "#1d4ed8",
                "#eff6ff"
            );

            // Hanya semak rekod untuk SESI semasa.
            // Rekod pagi tidak menghalang rekod KAFA pada hari yang sama.
            const existing = await findTodayAttendance(student.studentId, session);

            $("overlay").style.backgroundColor = existing
                ? "#f59e0b"
                : "#16a34a";

            if (existing) {
                const firstTime = existing.timestamp
                    ? existing.timestamp.toLocaleTimeString("ms-MY")
                    : "-";

                $("overlayIcon").innerText = "ℹ️";
                $("overlayText").innerText = `SUDAH DIREKODKAN — ${sessionLabel}`;
                $("overlayDetail").innerHTML =
                    `<strong>${student.name.toUpperCase()}</strong><br>` +
                    `${student.kelas.toUpperCase()}<br>` +
                    `ID: ${student.studentId}<br><br>` +
                    `Sesi: <strong>${sessionLabel}</strong><br>` +
                    `Telah diimbas pada ${firstTime}`;
            } else {
                await addDoc(collection(db, "attendance"), {
                    studentId: student.studentId,
                    name: student.name.toUpperCase(),
                    kelas: student.kelas.toUpperCase(),
                    session,
                    sessionLabel,
                    status,
                    timestamp: serverTimestamp()
                });

                // Kemas kini cache tempatan supaya scan seterusnya tidak query Firestore.
                todayAttendanceCache.set(
                    attendanceCacheKey(student.studentId, session),
                    {
                        studentId: student.studentId,
                        name: student.name.toUpperCase(),
                        kelas: student.kelas.toUpperCase(),
                        session,
                        sessionLabel,
                        status,
                        timestamp: now
                    }
                );
                todayAttendanceLoaded = true;
                todayAttendanceDateKey = getTodayKey(now);

                $("overlayIcon").innerText = "✅";
                $("overlayText").innerText = `KEHADIRAN ${sessionLabel} DIREKODKAN`;
                $("overlayDetail").innerHTML =
                    `<strong>${student.name.toUpperCase()}</strong><br>` +
                    `${student.kelas.toUpperCase()}<br>` +
                    `ID: ${student.studentId}<br><br>` +
                    `Sesi: <strong>${sessionLabel}</strong><br>` +
                    `<strong>${status.toUpperCase()}</strong><br>` +
                    `${now.toLocaleTimeString("ms-MY")}`;
            }

            $("overlay").style.display = "flex";

            setTimeout(() => {
                $("overlay").style.display = "none";
                $("confirmModal").style.display = "none";
                $("accessCodeModal").style.display = "none";

                pendingStudent = null;
                isProcessing = false;
                wrongMatchCount = 0;
                lastScanTime = 0;
                candidateStudentId = null;
                candidateMatchCount = 0;
                scanBlockedUntil = 0;

                setStatus("Mencari wajah...", "#475569", "#eff6ff");
                $("studentBadge").style.display = "none";

                resetTimer();
            }, 3500);

        } catch (error) {
            console.error("Ralat database:", error);

            setStatus(
                "Ralat menyimpan rekod. Sila cuba lagi.",
                "#b91c1c",
                "#fef2f2"
            );

            setTimeout(() => {
                isProcessing = false;
                pendingStudent = null;
                lastScanTime = 0;
                candidateStudentId = null;
                candidateMatchCount = 0;
                scanBlockedUntil = Date.now() + 1200;
            }, 2500);
        }
    }

    window.confirmMatch = function(isMatch) {
        $("confirmModal").style.display = "none";

        if (!pendingStudent) {
            isProcessing = false;
            return;
        }

        if (isMatch) {
            wrongMatchCount = 0;
            saveAttendance(pendingStudent);
        } else {
            wrongMatchCount++;

            if (wrongMatchCount >= 2) {
                $("accessCodeModal").style.display = "flex";
                $("personalCodeInput").value = "";
                setTimeout(() => $("personalCodeInput").focus(), 100);
            } else {
                // Jangan benarkan scanner terus menangkap wajah yang sama.
                // Beri masa kepada murid untuk bersedia semula.
                pendingStudent = null;
                candidateStudentId = null;
                candidateMatchCount = 0;
                scanBlockedUntil = Date.now() + REJECT_COOLDOWN;
                isProcessing = false;
                lastScanTime = 0;

                setStatus(
                    "SILA BERSEDIA... IMBASAN AKAN DISAMBUNG DALAM 3 SAAT",
                    "#92400e",
                    "#fffbeb"
                );

                let remaining = 3;
                const countdown = setInterval(() => {
                    remaining--;
                    if (remaining > 0) {
                        setStatus(
                            `SILA BERSEDIA... ${remaining} SAAT`,
                            "#92400e",
                            "#fffbeb"
                        );
                    } else {
                        clearInterval(countdown);
                        setStatus("Mencari wajah...", "#475569", "#eff6ff");
                        lastScanTime = 0;
                        resetTimer();
                    }
                }, 1000);
            }
        }
    };

    window.submitAccessCode = async function() {
        const inputCode = $("personalCodeInput").value.trim();

        if (!inputCode) {
            alert("Sila masukkan kod akses.");
            return;
        }

        // Kod Akses datang daripada Master Collection students.accessCode.
        // registeredUsers telah dibina daripada Master Data + biometrik,
        // jadi nilai ini kekal sepadan dengan murid yang didaftarkan.
        const foundUser = registeredUsers.find(user => {
            const savedCode = String(user.accessCode ?? "").trim();
            return savedCode !== "" && savedCode === inputCode;
        });

        if (!foundUser) {
            alert("Kod Akses tidak sah!");
            $("personalCodeInput").value = "";
            $("personalCodeInput").focus();
            return;
        }

        $("accessCodeModal").style.display = "none";
        wrongMatchCount = 0;
        pendingStudent = foundUser;

        await saveAttendance(foundUser);
    };

    window.cancelAccessCode = function() {
        $("accessCodeModal").style.display = "none";
        $("personalCodeInput").value = "";
        pendingStudent = null;
        wrongMatchCount = 0;
        isProcessing = false;
        lastScanTime = 0;
        candidateStudentId = null;
        candidateMatchCount = 0;
        scanBlockedUntil = Date.now() + 800;
        setStatus("Mencari wajah...", "#475569", "#eff6ff");
    };

    window.goToSleep = function() {
        if (
            $("pinSection").style.display !== "none" ||
            isProcessing ||
            !currentStream
        ) {
            return;
        }

        isSleeping = true;
        $("sleepOverlay").style.display = "flex";
    };

    window.wakeUp = function() {
        if (!isSleeping) return;

        isSleeping = false;
        $("sleepOverlay").style.display = "none";
        resetTimer();
    };

    function resetTimer() {
        clearTimeout(sleepTimer);

        if (
            !isSleeping &&
            $("pinSection").style.display === "none" &&
            currentStream &&
            !isProcessing
        ) {
            sleepTimer = setTimeout(goToSleep, SLEEP_TIMEOUT);
        }
    }

    window.addEventListener("touchstart", () => {
        if (isSleeping) wakeUp();
        else resetTimer();
    }, { passive: true });

    window.addEventListener("click", () => {
        if (isSleeping) wakeUp();
        else resetTimer();
    });

    window.addEventListener("beforeunload", () => {
        stopCamera();
    });

    $("pinInput").addEventListener("keydown", event => {
        if (event.key === "Enter") {
            verifyPin();
        }
    });

    $("personalCodeInput").addEventListener("keydown", event => {
        if (event.key === "Enter") {
            submitAccessCode();
        }
    });

    initSystem();
</script>
